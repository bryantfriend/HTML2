<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structure Safari</title>
  <style>
    :root { color-scheme: dark; --bg:#120b02; --panel:#201308; --line:#f59e0b; --accent:#fbbf24; --accent2:#4ade80; --ink:#fef3c7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,sans-serif; background:radial-gradient(circle at top, #3b1f05, #020617 68%); color:var(--ink); }
    .game { width:min(920px, 100%); display:grid; gap:18px; padding:24px; border-radius:28px; background:linear-gradient(180deg, rgba(32,19,8,.95), rgba(2,6,23,.96)); border:1px solid rgba(251,191,36,.24); box-shadow:0 20px 50px rgba(0,0,0,.35); }
    .top { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; }
    .eyebrow { margin:0 0 8px; color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.24em; font-weight:800; }
    h1 { margin:0; font-size:clamp(32px, 5vw, 48px); }
    .sub { margin:8px 0 0; color:#fde68a; max-width:640px; line-height:1.55; }
    .stats { display:flex; gap:12px; flex-wrap:wrap; }
    .pill { min-width:110px; padding:12px 14px; border-radius:18px; background:rgba(120,53,15,.42); border:1px solid rgba(251,191,36,.22); }
    .pill b { display:block; font-size:22px; color:white; }
    .layout { display:grid; gap:18px; grid-template-columns:1fr 320px; }
    .map, .panel { padding:18px; border-radius:24px; background:rgba(15,23,42,.86); border:1px solid rgba(148,163,184,.14); }
    .prompt { margin:0 0 10px; color:#fcd34d; font-size:12px; text-transform:uppercase; letter-spacing:.18em; font-weight:800; }
    .zones { display:grid; gap:12px; }
    .zone { position:relative; min-height:70px; padding:16px; border-radius:18px; border:2px dashed rgba(148,163,184,.26); color:#cbd5e1; display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(15,23,42,.55); }
    .zone.active { border-color:rgba(251,191,36,.65); background:rgba(120,53,15,.28); box-shadow:0 0 0 1px rgba(251,191,36,.16); }
    .zone.done { border-style:solid; border-color:rgba(74,222,128,.55); background:rgba(20,83,45,.38); color:#ecfccb; }
    .zone-name { font:800 12px/1 Arial,sans-serif; text-transform:uppercase; letter-spacing:.18em; color:#e2e8f0; }
    .zone-tag { font:900 20px/1 Arial,sans-serif; color:white; }
    .choices { display:grid; gap:12px; }
    .choice { width:100%; padding:14px 16px; border-radius:18px; border:1px solid rgba(148,163,184,.16); background:rgba(15,23,42,.76); color:white; text-align:left; cursor:pointer; transition:transform .12s ease, border-color .12s ease, background .12s ease; }
    .choice:hover { transform:translateY(-1px); border-color:rgba(251,191,36,.35); }
    .choice.good { background:rgba(20,83,45,.45); border-color:rgba(74,222,128,.6); }
    .choice.bad { background:rgba(127,29,29,.45); border-color:rgba(248,113,113,.6); }
    .meter { height:12px; border-radius:999px; overflow:hidden; background:rgba(148,163,184,.18); }
    .meter > div { height:100%; width:0%; border-radius:inherit; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition:width .2s ease; }
    .msg { min-height:24px; margin:0; color:#fde68a; font-weight:700; }
    .end { display:none; gap:12px; padding:18px; border-radius:24px; background:linear-gradient(180deg, rgba(20,83,45,.35), rgba(6,78,59,.28)); border:1px solid rgba(74,222,128,.25); }
    .end.show { display:grid; }
    .restart { justify-self:start; padding:12px 16px; border:none; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--accent2)); color:#451a03; font-weight:900; cursor:pointer; }
    @media (max-width: 760px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="game">
    <section class="top">
      <div>
        <p class="eyebrow">Mini Game</p>
        <h1>Structure Safari</h1>
        <p class="sub">Explore the page map and match the right semantic tag to each zone. Clear every stop on the safari trail before time runs out.</p>
      </div>
      <div class="stats">
        <div class="pill"><span>Zone</span><b id="zone-count">1 / 5</b></div>
        <div class="pill"><span>Score</span><b id="score">0</b></div>
        <div class="pill"><span>Time</span><b id="time">60</b></div>
      </div>
    </section>

    <div class="meter"><div id="meter"></div></div>
    <p class="msg" id="message">Match the highlighted zone with its best semantic tag.</p>

    <section class="layout">
      <section class="map">
        <p class="prompt">Page Map</p>
        <div class="zones" id="zones"></div>
      </section>

      <aside class="panel">
        <p class="prompt">Choose the Tag</p>
        <div class="choices" id="choices"></div>
      </aside>
    </section>

    <section class="end" id="end">
      <p class="eyebrow">Safari Report</p>
      <h2 id="end-title" style="margin:0;font-size:30px;">Adventure complete!</h2>
      <p id="end-copy" style="margin:0;color:#dcfce7;line-height:1.55;"></p>
      <button class="restart" id="restart">Play Again</button>
    </section>
  </main>

  <script>
    const zones = [
      { name:'Top of the page', tag:'header' },
      { name:'Menu area', tag:'nav' },
      { name:'Main content', tag:'main' },
      { name:'Story card', tag:'article' },
      { name:'Bottom strip', tag:'footer' }
    ];

    const choices = ['header', 'nav', 'main', 'article', 'section', 'aside', 'footer'];
    const state = { index:0, score:0, time:60, timer:null };

    const zonesEl = document.getElementById('zones');
    const choicesEl = document.getElementById('choices');
    const zoneCountEl = document.getElementById('zone-count');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const meterEl = document.getElementById('meter');
    const msgEl = document.getElementById('message');
    const endEl = document.getElementById('end');

    function renderZones() {
      zonesEl.innerHTML = zones.map((zone, index) => `
        <div class="zone ${index === state.index ? 'active' : ''} ${index < state.index ? 'done' : ''}">
          <div>
            <div class="zone-name">Zone ${index + 1}</div>
            <div>${zone.name}</div>
          </div>
          <div class="zone-tag">${index < state.index ? `<${zone.tag}>` : '?'}</div>
        </div>`).join('');
    }

    function renderChoices() {
      choicesEl.innerHTML = choices.map(choice => `<button class="choice" data-value="${choice}">&lt;${choice}&gt;</button>`).join('');
      choicesEl.querySelectorAll('.choice').forEach(button => button.addEventListener('click', onChoice));
    }

    function renderStats() {
      zoneCountEl.textContent = `${Math.min(state.index + 1, zones.length)} / ${zones.length}`;
      scoreEl.textContent = state.score;
      timeEl.textContent = state.time;
      meterEl.style.width = `${(state.index / zones.length) * 100}%`;
    }

    function onChoice(event) {
      const zone = zones[state.index];
      const button = event.currentTarget;
      const correct = button.dataset.value === zone.tag;
      button.classList.add(correct ? 'good' : 'bad');
      msgEl.textContent = correct ? `Correct. ${zone.name} uses <${zone.tag}>.` : `Not quite. ${zone.name} should use <${zone.tag}>.`;
      if (correct) state.score += 1;
      scoreEl.textContent = state.score;
      choicesEl.querySelectorAll('.choice').forEach(choice => choice.disabled = true);
      setTimeout(nextZone, 700);
    }

    function nextZone() {
      state.index += 1;
      if (state.index >= zones.length) return finishGame();
      renderZones();
      renderChoices();
      renderStats();
      msgEl.textContent = 'Match the highlighted zone with its best semantic tag.';
    }

    function finishGame() {
      clearInterval(state.timer);
      meterEl.style.width = '100%';
      endEl.classList.add('show');
      const title = document.getElementById('end-title');
      const copy = document.getElementById('end-copy');
      title.textContent = state.score === zones.length ? 'Perfect explorer!' : state.score >= 4 ? 'Great safari!' : 'Good scouting run!';
      copy.textContent = `You matched ${state.score} of ${zones.length} zones correctly. Replay to lock the semantic tags into memory.`;
      choicesEl.innerHTML = '';
      renderZones();
      msgEl.textContent = 'Safari complete.';
    }

    function startGame() {
      state.index = 0;
      state.score = 0;
      state.time = 60;
      endEl.classList.remove('show');
      renderZones();
      renderChoices();
      renderStats();
      msgEl.textContent = 'Match the highlighted zone with its best semantic tag.';
      clearInterval(state.timer);
      state.timer = setInterval(() => {
        state.time -= 1;
        renderStats();
        if (state.time <= 0) finishGame();
      }, 1000);
    }

    document.getElementById('restart').addEventListener('click', startGame);
    startGame();
  </script>
</body>
</html>
