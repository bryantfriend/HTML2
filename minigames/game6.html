<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TagQuest Platformer</title>
    <style>
        :root {
            --bg-dark: #020617;
            --surface: #1e293b;
            --primary: #38bdf8;
            --true-color: #10b981;
            --false-color: #f43f5e;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            background: #0f172a;
            border: 4px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Trivia Overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .card {
            background: var(--surface);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            width: 100%;
            max-width: 450px;
            transform: translateY(20px);
            opacity: 0;
            transition: 0.4s all;
        }

        #overlay.active .card {
            transform: translateY(0);
            opacity: 1;
        }

        .tag-display {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .paths {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            width: 100%;
        }

        .path-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .path-btn svg { width: 32px; height: 32px; fill: white; }
        .btn-true { background: var(--true-color); }
        .btn-false { background: var(--false-color); }
        .path-btn:hover { transform: scale(1.05); }

        /* UI Elements */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Mobile Controls */
        #controls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 0 20px;
            justify-content: space-between;
            pointer-events: none;
        }

        .ctrl-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn-ctrl {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        @media (max-width: 800px) {
            #controls { display: flex; }
            #game-wrapper { height: 70vh; }
        }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10px, 0); }
            75% { transform: translate(10px, 0); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="hud">
            <span id="score-text">Score: 0</span>
            <span id="progress-text">Level 1: Semantic Tags</span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="overlay">
            <div class="card" id="trivia-card">
                <div class="tag-display" id="tag-name">&lt;main&gt;</div>
                <div id="question-text">Is this tag used for navigation?</div>
                <div class="paths">
                    <button class="path-btn btn-true" onclick="answerTrivia(true)">
                        <svg viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
                        TRUE
                    </button>
                    <button class="path-btn btn-false" onclick="answerTrivia(false)">
                        <svg viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>
                        FALSE
                    </button>
                </div>
            </div>
        </div>

        <div id="controls">
            <div class="ctrl-group">
                <div class="btn-ctrl" ontouchstart="keys.left=true" ontouchend="keys.left=false">←</div>
                <div class="btn-ctrl" ontouchstart="keys.right=true" ontouchend="keys.right=false">→</div>
            </div>
            <div class="ctrl-group">
                <div class="btn-ctrl" ontouchstart="keys.up=true" ontouchend="keys.up=false">↑</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const tagNameEl = document.getElementById('tag-name');
        const qTextEl = document.getElementById('question-text');

        // Game Configuration
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const SPEED = 5;
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 450;

        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        let score = 0;
        let isPaused = false;
        let currentLevelWidth = 3000;

        const keys = { left: false, right: false, up: false };

        const triviaData = [
            { x: 600, tag: "<div>", q: "Is this a semantic element for navigation?", a: false },
            { x: 1200, tag: "<main>", q: "Is it recommended to have only one <main> tag visible?", a: true },
            { x: 1800, tag: "<img>", q: "Is the 'alt' attribute required for accessibility?", a: true },
            { x: 2400, tag: "<p>", q: "Can you put a <div> inside a <p> tag?", a: false }
        ];

        let activeTriviaIdx = -1;

        class Player {
            constructor() {
                this.width = 40;
                this.height = 60;
                this.x = 50;
                this.y = 300;
                this.vx = 0;
                this.vy = 0;
                this.onGround = false;
                this.color = '#38bdf8';
            }

            draw() {
                // Draw Character (Robot/Coder SVG style)
                ctx.fillStyle = this.color;
                // Head
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height - 10, 8);
                ctx.fill();
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 8, this.y + 12, 8, 8);
                ctx.fillRect(this.x + 24, this.y + 12, 8, 8);
                // Feet
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(this.x + 5, this.y + this.height - 10, 10, 10);
                ctx.fillRect(this.x + this.width - 15, this.y + this.height - 10, 10, 10);
            }

            update(platforms) {
                if (keys.left) this.vx = -SPEED;
                else if (keys.right) this.vx = SPEED;
                else this.vx *= 0.8;

                if (keys.up && this.onGround) {
                    this.vy = JUMP_FORCE;
                    this.onGround = false;
                }

                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;

                // Ground Collision
                this.onGround = false;
                platforms.forEach(p => {
                    if (this.x < p.x + p.w && this.x + this.width > p.x &&
                        this.y + this.height > p.y && this.y + this.height < p.y + p.h + this.vy) {
                        this.y = p.y - this.height;
                        this.vy = 0;
                        this.onGround = true;
                    }
                });

                // Screen boundaries
                if (this.x < 0) this.x = 0;
                if (this.y > CANVAS_HEIGHT) { // Fell off
                    this.x = 50;
                    this.y = 200;
                }
            }
        }

        const player = new Player();
        const platforms = [
            { x: 0, y: 400, w: 800, h: 50 },
            { x: 900, y: 350, w: 600, h: 50 },
            { x: 1600, y: 400, w: 800, h: 50 },
            { x: 2500, y: 350, w: 500, h: 50 },
            // Floating blocks
            { x: 400, y: 280, w: 100, h: 20 },
            { x: 1300, y: 250, w: 100, h: 20 },
            { x: 2100, y: 280, w: 100, h: 20 }
        ];

        function triggerTrivia(idx) {
            isPaused = true;
            activeTriviaIdx = idx;
            const data = triviaData[idx];
            tagNameEl.innerHTML = data.tag;
            qTextEl.textContent = data.q;
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
        }

        function answerTrivia(choice) {
            const data = triviaData[activeTriviaIdx];
            const isCorrect = choice === data.a;

            if (isCorrect) {
                score += 100;
                document.getElementById('score-text').textContent = `Score: ${score}`;
                closeTrivia();
                // Remove the gate so we don't hit it again
                triviaData.splice(activeTriviaIdx, 1);
            } else {
                document.getElementById('trivia-card').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('trivia-card').classList.remove('shake');
                    player.x -= 200; // Knockback
                    closeTrivia();
                }, 500);
            }
        }

        function closeTrivia() {
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                isPaused = false;
                animate();
            }, 300);
        }

        function drawBackground(cameraX) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw some "Stars" or code snippets in background
            ctx.fillStyle = 'rgba(56, 189, 248, 0.05)';
            for (let i = 0; i < 20; i++) {
                ctx.font = '20px monospace';
                ctx.fillText('{}', (i * 200 - cameraX * 0.2) % 2000, 100 + (i * 50) % 300);
            }
        }

        function animate() {
            if (isPaused) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Camera logic
            let cameraX = player.x - CANVAS_WIDTH / 3;
            if (cameraX < 0) cameraX = 0;

            drawBackground(cameraX);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Draw Platforms
            ctx.fillStyle = '#334155';
            platforms.forEach(p => {
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 10);
                ctx.fill();
                // Top accent
                ctx.fillStyle = '#475569';
                ctx.fillRect(p.x, p.y, p.w, 4);
                ctx.fillStyle = '#334155';
            });

            // Draw Trivia Gates
            triviaData.forEach((t, idx) => {
                // Draw Gate SVG-like
                ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
                ctx.fillRect(t.x, 0, 80, CANVAS_HEIGHT);
                ctx.fillStyle = varColor('--primary');
                ctx.font = 'bold 40px Inter';
                ctx.fillText('?', t.x + 30, 200);

                // Collision detection with gate
                if (player.x + player.width > t.x && player.x < t.x + 80) {
                    triggerTrivia(idx);
                }
            });

            player.update(platforms);
            player.draw();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        // Input listeners
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

        window.onload = animate;
    </script>
</body>
</html>
