<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Builder Academy: Mission HTML</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="p-4 md:p-8">
    <!-- Intro Video Overlay -->
    <div id="intro-video-container"
        class="fixed inset-0 z-50 bg-black flex items-center justify-center cursor-pointer transition-opacity duration-1000">
        <video id="intro-video" class="w-full h-full object-contain" src="assets/OquWay_Logo_Animation_Generation.mp4"
            playsinline></video>
        <div id="start-prompt" class="absolute inset-0 flex items-center justify-center bg-black/60 hidden">
            <button
                class="bg-[var(--neon-pink)] text-white font-bold py-4 px-8 rounded-lg text-2xl heading-font animate-pulse shadow-[0_0_20px_var(--neon-pink)]">INITIALIZE
                ACADEMY</button>
        </div>
        <button id="skip-video-btn"
            class="absolute bottom-6 right-6 text-gray-400 hover:text-white code-font text-sm z-50 tracking-widest hidden">SKIP
            >></button>
    </div>

    <header class="max-w-6xl mx-auto mb-12 flex justify-between items-center">
        <div>
            <h1 class="heading-font text-3xl md:text-4xl font-bold text-white glow-text cursor-pointer" id="logo-btn">
                CYBER-BUILDER <span class="text-[var(--neon-pink)]">ACADEMY</span> <span
                    class="text-sm code-font text-gray-500 ml-2" id="app-version">v1.011</span></h1>
            <p id="mission-subtitle" class="text-[var(--neon-cyan)] code-font text-sm mt-2">DASHBOARD_ACCESS_GRANTED</p>
        </div>
        <div class="hidden md:flex items-center gap-6" id="header-controls">
            <button id="back-menu-btn"
                class="hidden text-xs heading-font bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-4 rounded transition">
                &larr; ABORT MISSION
            </button>
            <div id="progress-container" class="hidden text-right">
                <div id="progress-bar-bg" class="w-48 h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div id="progress-bar-fill" class="h-full bg-[var(--neon-green)] transition-all duration-500"
                        style="width: 25%;"></div>
                </div>
                <p class="text-xs mt-1 code-font">SYNC: <span id="progress-text">25%</span></p>
            </div>
        </div>
    </header>

    <!-- Menu View -->
    <main id="menu-view" class="max-w-6xl mx-auto hidden">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <h2 class="heading-font text-2xl text-[var(--neon-cyan)]">AVAILABLE TRAINING MODULES</h2>
            <button id="sandbox-nav-btn"
                class="bg-[var(--neon-pink)] text-white font-bold py-2 px-6 rounded-lg text-lg heading-font hover:shadow-[0_0_15px_var(--neon-pink)] transition animate-pulse">
                &lt; CODE SANDBOX /&gt;
            </button>
        </div>
        <div id="menu-grid" class="menu-grid">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- Lesson View -->
    <main id="lesson-view" class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 items-start hidden">

        <!-- Left Column: Instructional Content -->
        <section id="lesson-content" class="space-y-6">
            <div class="cyber-card p-6 rounded-xl border-l-4 border-l-[var(--neon-cyan)]">
                <h2 id="module-title" class="heading-font text-xl text-[var(--neon-cyan)] mb-4">LOADING MODULE...</h2>
                <div id="module-body" class="space-y-4 text-gray-300 leading-relaxed">
                    <!-- Dynamic content injected here -->
                </div>
            </div>

            <!-- Animated SVG Zone -->
            <div class="cyber-card p-8 rounded-xl flex justify-center items-center min-h-[300px]" id="svg-display">
                <!-- Dynamic SVG injected here -->
            </div>

            <div class="mt-6 flex gap-4">
                <button id="prev-btn"
                    class="flex-1 py-3 px-6 rounded-lg bg-gray-800 text-gray-400 hover:bg-gray-700 transition heading-font text-sm hidden">BACK</button>
                <button id="next-btn"
                    class="flex-1 py-3 px-6 rounded-lg bg-[var(--neon-cyan)] text-black font-bold hover:shadow-[0_0_20px_var(--neon-cyan)] transition heading-font text-sm">NEXT
                    MISSION</button>
            </div>
        </section>

        <!-- Right Column: Interactive Editor -->
        <section id="editor-section" class="sticky top-8">
            <div class="rounded-xl overflow-hidden shadow-2xl border border-gray-700">
                <div class="terminal-header p-3 flex items-center">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                    <span class="ml-4 text-xs code-font text-gray-400">CYBER_TERM_1.0 — <span
                            id="file-name">index.html</span></span>
                </div>
                <div id="code-input-container" class="p-4 bg-[#1e1e1e]">
                    <label class="block text-xs text-gray-500 mb-2 code-font uppercase tracking-widest">Input
                        Code</label>
                    <textarea id="code-editor" class="w-full h-48 md:h-64 p-4 code-font text-sm rounded-md"
                        spellcheck="false"></textarea>
                </div>
                <div class="p-4 bg-[#252525] border-t border-gray-700">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-gray-500 code-font uppercase tracking-widest">Neural Link
                            Preview</label>
                        <span class="text-[10px] text-[var(--neon-green)] animate-pulse">● LIVE_FEED</span>
                    </div>
                    <div id="preview-area" class="p-4 overflow-auto prose max-w-none">
                        <!-- Output appears here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Completion View -->
    <main id="completion-view" class="max-w-6xl mx-auto hidden">
        <div id="completion-content"></div>
    </main>

    <!-- Sandbox View -->
    <main id="sandbox-view" class="max-w-7xl mx-auto hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="heading-font text-2xl text-[var(--neon-pink)] glow-text">CREATIVE SANDBOX</h2>
            <div class="flex gap-4">
                <button id="sandbox-open-btn"
                    class="bg-blue-800 hover:bg-blue-700 text-white py-2 px-6 rounded-lg text-sm heading-font transition border border-blue-600">OPEN
                    DATA</button>
                <button id="sandbox-save-btn"
                    class="bg-gray-800 hover:bg-gray-700 text-white py-2 px-6 rounded-lg text-sm heading-font transition border border-gray-600">SAVE
                    PROGRESS</button>
                <button id="sandbox-export-btn"
                    class="bg-[var(--neon-green)] hover:bg-green-400 text-black font-bold py-2 px-6 rounded-lg text-sm heading-font transition shadow-[0_0_10px_var(--neon-green)]">EXPORT
                    TO FILE</button>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-[70vh]">
            <!-- Left: Editor -->
            <section
                class="flex flex-col rounded-xl overflow-hidden shadow-2xl border border-[var(--neon-pink)] bg-[#1e1e1e]">
                <div class="terminal-header p-3 flex border-b border-gray-700">
                    <span class="dot dot-red"></span><span class="dot dot-yellow"></span><span
                        class="dot dot-green"></span>
                    <span class="ml-4 text-xs code-font text-[var(--neon-pink)]">sandbox.html</span>
                </div>
                <textarea id="sandbox-editor"
                    class="flex-1 w-full p-4 code-font text-sm bg-transparent text-white outline-none resize-none"
                    spellcheck="false"
                    placeholder="<!-- Build your awesome website here! -->&#10;<h1>My Portfolio</h1>"></textarea>
            </section>
            <!-- Right: Preview -->
            <section class="flex flex-col rounded-xl overflow-hidden shadow-2xl border border-gray-700 bg-white">
                <div class="p-3 bg-gray-200 border-b border-gray-300">
                    <span class="text-xs code-font text-gray-800 font-bold uppercase tracking-widest">Live Browser
                        Preview</span>
                </div>
                <iframe id="sandbox-preview" class="flex-1 w-full bg-white border-none"></iframe>
            </section>
        </div>
    </main>

    <!-- Sandbox Modals -->
    <!-- Save Modal -->
    <div id="save-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden">
        <div
            class="bg-[#1e1e1e] border border-[var(--neon-pink)] p-6 rounded-xl w-full max-w-sm shadow-[0_0_30px_rgba(255,0,229,0.3)]">
            <h3 class="heading-font text-xl text-[var(--neon-pink)] mb-4">SAVE PROJECT</h3>
            <label class="block text-xs text-gray-400 code-font mb-2">FILE NAME:</label>
            <input type="text" id="save-filename-input"
                class="w-full bg-black border border-gray-600 rounded p-2 text-white code-font mb-6 focus:border-[var(--neon-pink)] focus:outline-none"
                placeholder="my_awesome_project">
            <div class="flex justify-end gap-4">
                <button id="cancel-save-btn"
                    class="text-gray-400 hover:text-white code-font text-sm transition">CANCEL</button>
                <button id="confirm-save-btn"
                    class="bg-[var(--neon-pink)] hover:bg-pink-600 text-white font-bold py-2 px-4 rounded transition code-font">SAVE</button>
            </div>
        </div>
    </div>

    <!-- Open Modal -->
    <div id="open-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden">
        <div
            class="bg-[#1e1e1e] border border-[var(--neon-cyan)] p-6 rounded-xl w-full max-w-md shadow-[0_0_30px_rgba(0,242,255,0.3)] flex flex-col max-h-[80vh]">
            <h3 class="heading-font text-xl text-[var(--neon-cyan)] mb-4">OPEN PROJECT</h3>
            <div id="saved-projects-list" class="flex-1 overflow-y-auto space-y-2 mb-6 min-h-[150px]">
                <!-- Dynamic list goes here -->
            </div>
            <div class="flex justify-end">
                <button id="cancel-open-btn"
                    class="text-gray-400 hover:text-white code-font text-sm transition">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="lessons/manifest.js?v=2"></script>
    <script src="lessonLoader.js?v=2"></script>
    <script id="main-lessons-loader">
        // Initial load of metadata so the courseData can be built
        // We'll wrap the main.js initialization in a way that waits for metadata
        window.LessonMetadataLoaded = (async () => {
            await window.LessonLoader.loadAllMetadata();
            // Once metadata is loaded, we can define courseData
            window.courseData = {
                title: "Cyber-Builder Academy",
                lessons: window.LessonManifest.lessons.map(l => window.Lessons[l.id])
            };
        })();
    </script>

    <script src="stages/validators/validateShowMenu.js?v=2"></script>
    <script src="stages/validators/validateStartLesson.js?v=2"></script>
    <script src="stages/validators/validateLoadModule.js?v=2"></script>
    <script src="stages/validators/validateUpdatePreview.js?v=2"></script>
    <script src="stages/validators/validateCompleteLesson.js?v=2"></script>
    <script src="stages/validators/validateShowSandbox.js?v=2"></script>
    <script src="stages/validators/validateUpdateSandbox.js?v=2"></script>
    <script src="stages/validators/validateSaveSandbox.js?v=2"></script>
    <script src="stages/validators/validateLoadSandbox.js?v=2"></script>
    <script src="stages/validators/validators.js?v=2"></script>

    <script src="stages/normalizers/normalizeStartLesson.js?v=2"></script>
    <script src="stages/normalizers/normalizeLoadModule.js?v=2"></script>
    <script src="stages/normalizers/normalizers.js?v=2"></script>

    <script src="stages/contexts/addContextCourseData.js?v=2"></script>
    <script src="stages/contexts/contexts.js?v=2"></script>

    <script src="stages/authorizors/authorizeAll.js?v=2"></script>
    <script src="stages/authorizors/authorizors.js?v=2"></script>

    <script src="stages/processors/processShowMenu.js?v=2"></script>
    <script src="stages/processors/processStartLesson.js?v=2"></script>
    <script src="stages/processors/processLoadModule.js?v=2"></script>
    <script src="stages/processors/processUpdatePreview.js?v=2"></script>
    <script src="stages/processors/processCompleteLesson.js?v=2"></script>
    <script src="stages/processors/processShowSandbox.js?v=2"></script>
    <script src="stages/processors/processUpdateSandbox.js?v=2"></script>
    <script src="stages/processors/processSaveSandbox.js?v=2"></script>
    <script src="stages/processors/processLoadSandbox.js?v=2"></script>
    <script src="stages/processors/processors.js?v=2"></script>

    <script src="stages/finalizers/finalizeMenuRender.js?v=2"></script>
    <script src="stages/finalizers/finalizeLessonModule.js?v=2"></script>
    <script src="stages/finalizers/finalizePreviewRender.js?v=2"></script>
    <script src="stages/finalizers/finalizeCompleteLesson.js?v=2"></script>
    <script src="stages/finalizers/finalizeMissionCompletion.js?v=2"></script>
    <script src="stages/finalizers/finalizeShowSandbox.js?v=2"></script>
    <script src="stages/finalizers/finalizeUpdateSandbox.js?v=2"></script>
    <script src="stages/finalizers/finalizeSaveSandbox.js?v=2"></script>
    <script src="stages/finalizers/finalizeLoadSandbox.js?v=2"></script>
    <script src="stages/finalizers/finalizers.js?v=2"></script>

    <script src="stages/emitters/emitResult.js?v=2"></script>
    <script src="stages/emitters/emitters.js?v=2"></script>

    <script src="intents/showMenu.js?v=2"></script>
    <script src="intents/startLesson.js?v=2"></script>
    <script src="intents/loadModule.js?v=2"></script>
    <script src="intents/updatePreview.js?v=2"></script>
    <script src="intents/completeLesson.js?v=2"></script>
    <script src="intents/showSandbox.js?v=2"></script>
    <script src="intents/updateSandbox.js?v=2"></script>
    <script src="intents/saveSandbox.js?v=2"></script>
    <script src="intents/loadSandbox.js?v=2"></script>
    <script src="intents/intents.js?v=2"></script>

    <script src="intentEngine.js?v=2"></script>
    <script src="main.js?v=2"></script>
</body>

</html>
